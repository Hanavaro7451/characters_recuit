name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: characters_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: characters_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U characters_test -d characters_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://characters_test:ci-only-password@127.0.0.1:5432/characters_test_ci
      TEST_DATABASE_URL: postgresql+asyncpg://characters_test:ci-only-password@127.0.0.1:5432/characters_test_ci
      ALLOW_TEST_DATABASE_RESET: "1"
      JWT_SECRET_KEY: ci-only-secret-never-use-outside-tests
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.27"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy app
      - name: Unit tests
        run: uv run --frozen pytest tests --ignore=tests/integration
      - name: PostgreSQL integration tests (required)
        run: uv run --frozen pytest tests/integration
